name: Publish bootstrap release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

env:
  RELEASE_TAG: v0.5.7-zh
  RELEASE_TITLE: Native Tailscale TUN v0.5.7-zh
  RELEASE_ZIP: native-tailscale-magisk-bootstrap-v0.5.7-zh.zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release asset
        run: |
          set -eu
          test -f "release/$RELEASE_ZIP"
          grep -F "release/$RELEASE_ZIP" SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS

      - name: Publish v0.5.7-zh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" \
              "release/$RELEASE_ZIP" \
              SHA256SUMS \
              --clobber
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            "release/$RELEASE_ZIP" \
            SHA256SUMS \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md
